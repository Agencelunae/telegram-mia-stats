name: Suivi abonnés Telegram

on:
  schedule:
    # Horaires volontairement décalés des heures rondes (5h00, 6h00 UTC)
    # car ce sont les créneaux les plus demandés sur GitHub Actions, donc
    # les plus sujets à retard ou saut d'exécution en cas de forte charge.
    # Trois créneaux dans la journée = filet de sécurité ; grâce à la
    # vérification "date déjà présente ?" dans le script, un seul écrit
    # réellement une ligne, les autres ne font rien si c'est déjà fait.
    - cron: '17 5 * * *'   # ~7h17 heure française en été (CEST = UTC+2)
    - cron: '17 6 * * *'   # ~7h17 heure française en hiver (CET = UTC+1)
    - cron: '43 10 * * *'  # filet de sécurité en fin de matinée (~12h43/11h43)
  workflow_dispatch:        # permet aussi de le lancer manuellement depuis GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le script
        run: python telegram_stats.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
