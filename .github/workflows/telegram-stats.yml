name: Suivi abonnés Telegram

on:
  schedule:
    # Au lieu d'un seul horaire fragile, on retente TOUTES LES HEURES entre
    # 5h23 et 14h23 UTC (~7h23-16h23 heure française en été, 6h23-15h23 en
    # hiver). GitHub Actions retarde ou saute parfois des exécutions
    # planifiées (incidents documentés fin août 2026) ; multiplier les
    # tentatives maximise les chances qu'au moins une passe dans la
    # journée. Le script vérifie si la ligne du jour existe déjà avant
    # d'écrire, donc AUCUN RISQUE DE DOUBLON : dès qu'une tentative réussit,
    # toutes les suivantes de la journée ne font rien.
    - cron: '23 5-14 * * *'
  workflow_dispatch:        # permet aussi de le lancer manuellement depuis GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le script
        run: python telegram_stats.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
