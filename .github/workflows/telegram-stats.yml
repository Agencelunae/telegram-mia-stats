name: Suivi abonnés Telegram

on:
  schedule:
    # Deux horaires car GitHub Actions ne connaît que l'UTC.
    # Le script vérifie lui-même l'heure locale à Paris et ne fait rien
    # lors du déclenchement en trop (voir telegram_stats.py).
    - cron: '0 5 * * *'   # 7h heure française en été (CEST = UTC+2)
    - cron: '0 6 * * *'   # 7h heure française en hiver (CET = UTC+1)
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le script
        run: python telegram_stats.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
